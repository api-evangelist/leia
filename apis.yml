- name: Immersity AI Authentication API
  description: >-
    OAuth 2.0 / OpenID Connect token endpoint for the Immersity AI Keycloak realm. Exchange a client ID and
    secret issued from the Immersity account page for a bearer access token using the client_credentials
    grant; that token authorizes every Immersity Cloud API call.
  humanURL: https://docs-api.immersity.ai/reference/get-access-token-1
  baseURL: https://auth.immersity.ai/auth/realms/immersity
  tags:
