aid: leia
name: Leia
description: >-
  Leia Inc. is the Silicon Valley company behind Immersity, a platform for immersive 3D experiences on
  everyday devices. Spun out of HP Labs in 2014 by physicist David Fattal, Leia pairs a Switchable-Display
  hardware stack (nano-optics, liquid-crystal switchable layer, per-pixel panel calibration, shipped in
  Lume Pad, Acer SpatialLabs, Samsung Odyssey 3D, ASUS, Nubia and zSpace devices) with Spatial AI software
  that converts flat 2D photos and video into stereo, top-bottom, LIF and Apple Vision spatial output in
  real time. Developers reach that Spatial AI through the Immersity Cloud API — a credit-metered REST API
  at api.immersity.ai with OAuth 2.0 client-credentials auth via a Keycloak realm, covering disparity-map
  estimation, animation generation, stereo SBS and top-bottom rendering, LIF encode/decode, 2D-to-3D video
  conversion and presigned Leia Storage uploads. Formerly known as LeiaPix; the company acquired Dimenco
  and the Philips 3D patent portfolio in 2023 and holds 2,000+ patents.
