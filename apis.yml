apis:
- name: Immersity Cloud API
  description: >-
    Credit-metered REST API for Spatial AI media transformation — estimate a disparity (depth) map from a
    single 2D image, generate 3D animations from an image plus its disparity map, render stereo side-by-side
    and top-bottom pairs, encode and decode Leia Image Format (LIF) files, convert 2D video to 3D or Apple
    Vision spatial video, read product credit prices, and mint presigned Leia Storage upload URLs. Results
    are written directly to a caller-supplied presigned URL; long-running video jobs notify a callbackUrl.
  humanURL: https://docs-api.immersity.ai/docs/getting-started
  baseURL: https://api.immersity.ai
  tags:
